<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alumnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h2>Lista de Alumnos</h2>

    <div class="mb-3">
        <a href="/alumnos/nuevo" class="btn btn-primary">Nuevo Alumno</a>
        <a href="/escuelas" class="btn btn-secondary">Ver Escuelas</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Matrícula</th>
                <th>Correo</th>
                <th>Escuela</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="alumno : ${alumnos}">
                <td th:text="${alumno.id}"></td>
                <td th:text="${alumno.nombre}"></td>
                <td th:text="${alumno.matricula}"></td>
                <td th:text="${alumno.correo}"></td>
                <td th:text="${alumno.escuela != null ? alumno.escuela.nombre : 'Sin Escuela'}"></td>
                <td>
                    <a th:href="@{/alumnos/editar/{id}(id=${alumno.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/alumnos/eliminar/{id}(id=${alumno.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Deseas eliminar este alumno?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
