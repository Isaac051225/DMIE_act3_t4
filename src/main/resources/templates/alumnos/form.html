<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h2 th:text="${alumno.id == null ? 'Nuevo Alumno' : 'Editar Alumno'}">Formulario Alumno</h2>

    <form th:action="@{/alumnos/guardar}" th:object="${alumno}" method="post">
        
        <!-- Campo oculto para el ID -->
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Matrícula</label>
            <input type="text" th:field="*{matricula}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Correo Electrónico</label>
            <input type="email" th:field="*{correo}" class="form-control" required />
        </div>

        <!-- Selección de la Escuela (Relación One-To-Many) -->
        <div class="mb-3">
            <label class="form-label">Escuela</label>
            <select th:field="*{escuela}" class="form-select" required>
                <option value="" disabled selected>-- Seleccione una Escuela --</option>
                <option th:each="esc : ${escuelas}" 
                        th:value="${esc.id}" 
                        th:text="${esc.nombre}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/alumnos" class="btn btn-secondary">Cancelar</a>
    </form>

</body>
</html>
