<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Escuelas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h2>Lista de Escuelas</h2>

    <div class="mb-3">
        <a href="/escuelas/nuevo" class="btn btn-primary">Nueva Escuela</a>
        <a href="/alumnos" class="btn btn-secondary">Ver Alumnos</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Clave</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="escuela : ${escuelas}">
                <td th:text="${escuela.id}"></td>
                <td th:text="${escuela.nombre}"></td>
                <td th:text="${escuela.clave}"></td>
                <td>
                    <a th:href="@{/escuelas/editar/{id}(id=${escuela.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/escuelas/eliminar/{id}(id=${escuela.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Deseas eliminar esta escuela?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
