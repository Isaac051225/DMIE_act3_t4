<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Escuela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h2 th:text="${escuela.id == null ? 'Nueva Escuela' : 'Editar Escuela'}">Formulario Escuela</h2>

    <form th:action="@{/escuelas/guardar}" th:object="${escuela}" method="post">
        
        <!-- Campo oculto para el ID si es edición -->
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Clave</label>
            <input type="text" th:field="*{clave}" class="form-control" required />
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/escuelas" class="btn btn-secondary">Cancelar</a>
    </form>

</body>
</html>
