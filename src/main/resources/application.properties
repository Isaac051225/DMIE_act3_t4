spring.application.name=act3_t4

# Puerto local para ejecutar la app
server.port=8086

# Conexión a tu MySQL local (con tu base de datos bd_actividad3 y contraseña root)
spring.datasource.url=jdbc:mysql://localhost:3306/isaac_act3_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
